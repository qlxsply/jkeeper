<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIS Cluster</title><style>
:root{font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#dbe3ee;background:#11151c;font-size:13px}*{box-sizing:border-box}body{margin:0}.app{max-width:1480px;min-height:100vh;margin:auto;background:#161b23;display:flex;flex-direction:column}.top{height:65px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2a323d}.brand{display:flex;gap:12px;align-items:center;font-size:17px;font-weight:650;letter-spacing:.2px}.logo{width:33px;height:33px;border-radius:9px;background:#376bda;display:grid;place-items:center;font-weight:800;color:white;font-size:15px}.muted{color:#8290a4}.topright{display:flex;gap:20px;align-items:center;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#40bd91;display:inline-block;margin-right:7px}.main{padding:24px 28px;flex:1}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.metric{background:#1d242e;border:1px solid #2d3744;border-radius:10px;padding:17px 19px}.metric .num{font-size:27px;font-weight:650;margin-top:8px;font-variant-numeric:tabular-nums}.toolbar{display:flex;align-items:center;gap:9px;margin-bottom:15px;flex-wrap:wrap}.btn{height:35px;border:1px solid #394655;border-radius:7px;background:#252e3a;color:#e1e9f4;padding:0 14px;font:inherit;cursor:pointer;transition:.15s}.btn:hover{background:#344254}.btn:disabled{opacity:.35;cursor:not-allowed}.btn.primary{background:#376bda;border-color:#467be9;color:#fff}.btn.primary:hover{background:#477deb}.btn.danger{color:#f1b2b4}.btn svg{width:14px;height:14px;vertical-align:-2px;margin-right:5px}.sep{width:1px;height:23px;background:#37414e;margin:0 4px}.spacer{flex:1}.search{height:35px;width:210px;background:#1d242e;border:1px solid #394655;border-radius:7px;color:#dbe3ee;padding:0 12px;outline:none}.search:focus{border-color:#5587ed}.panel{border:1px solid #2d3744;background:#1b222c;border-radius:10px;overflow:hidden}.panelhead{height:49px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2d3744}.panelhead strong{font-size:13px;font-weight:600}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th{height:41px;background:#202833;color:#94a3b6;font-size:11px;font-weight:600}td{height:48px;border-top:1px solid #29333f;color:#c5d0df}th,td{padding:0 13px}th:first-child,td:first-child{padding-left:19px;width:44px}tr.data:hover{background:#242e3a}tr.selected{background:#243348!important}.check{accent-color:#4d80e5;width:15px;height:15px;cursor:pointer}.name{font-weight:600;color:#edf3fc}.status{display:inline-flex;align-items:center;gap:7px;font-size:12px}.status:before{content:'';height:7px;width:7px;border-radius:50%;background:#6d7888}.status.running:before{background:#38bf8e}.status.stopped:before{background:#758396}.status.warning:before{background:#e6a65c}.mono{font-family:Consolas,'Cascadia Mono',monospace;font-size:12px}.pill{display:inline-block;padding:4px 7px;border-radius:5px;background:#2a3543;color:#c2d1e4;margin:2px 4px 2px 0;font:11px Consolas,monospace}.action{border:0;background:transparent;color:#8fb5ff;cursor:pointer;padding:5px 7px;font:inherit}.action:hover{color:white}.empty{padding:28px;text-align:center;color:#8996a9}.bottom{margin-top:17px;display:grid;grid-template-columns:1.25fr 1fr;gap:15px}.logs{height:222px;overflow:auto;padding:13px 17px;background:#151b23;font:12px/1.95 Consolas,'Microsoft YaHei',monospace;color:#aab9ca}.logtime{color:#67778b;margin-right:12px}.logok{color:#62c99e}.logerr{color:#ee8f96}.config{padding:14px 17px;display:grid;grid-template-columns:100px minmax(0,1fr);gap:13px 10px;align-content:start;font-size:12px}.config .value{color:#c8d6e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Consolas,'Microsoft YaHei',monospace}.footer{height:42px;border-top:1px solid #2d3744;padding:0 28px;display:flex;align-items:center;justify-content:space-between;color:#7c8b9d;font-size:11px}.overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20}.overlay.open{display:flex}.dialog{background:#202833;border:1px solid #435064;border-radius:12px;width:min(430px,calc(100vw - 30px));padding:23px;box-shadow:0 18px 70px #0008}.dialog h3{margin:0 0 13px;font-size:17px}.dialog p{line-height:1.7;color:#b5c3d4}.dialogbuttons{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.toast{position:fixed;right:26px;bottom:26px;padding:11px 16px;background:#2d3b4c;color:#eaf1fa;border:1px solid #4b6076;border-radius:8px;display:none;z-index:30}.toast.show{display:block}@media(max-width:900px){.bottom{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.top{padding:0 16px}.main{padding:16px}.topright .hide{display:none}}@media(max-width:580px){.summary{gap:7px}.metric{padding:12px}.metric .num{font-size:23px}.search{width:100%}.toolbar .spacer{display:none}.footer{padding:0 12px}}

.main{padding-top:16px}.toolbar{margin-bottom:12px}.panelhead{height:42px}td{height:45px}th{height:38px}.name-running{color:#48ce99}.name-stopped{color:#eaf0f8}.name-busy{color:#f0757d}.row-actions{display:flex;gap:5px;align-items:center}.mini{height:27px;min-width:41px;padding:0 7px;border:1px solid #3c4a5a;border-radius:5px;background:#283342;color:#d8e5f5;font:11px 'Segoe UI','Microsoft YaHei',sans-serif;cursor:pointer}.mini:hover:not(:disabled){background:#39506c}.mini:disabled{color:#637184;background:#222a34;border-color:#303b48;cursor:not-allowed;opacity:.58}.actual{color:#9fbff7}.dot.working{background:#e7a55b}.btn:disabled{opacity:.36;background:#232a33;color:#748194}.rowcheck:disabled{cursor:not-allowed}.logs{height:185px}.bottom{margin-top:13px}.top{height:56px}.footer{height:35px}.name{font-weight:650}.tablewrap{min-width:0}.panel{border-radius:8px}@media(max-width:1100px){.row-actions{gap:3px}.mini{padding:0 5px;min-width:37px}th,td{padding:0 9px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">C</div><div>CIS Cluster <span class="muted" style="font-size:11px;font-weight:400;margin-left:6px">Manager</span></div></div><div class="topright"><span class="hide"><span class="dot" id="indicator"></span><span id="activity">监控中</span></span><span class="muted" id="clock">—</span><button class="btn" id="reload">↻ 刷新</button></div></header><main class="main"><section class="toolbar"><button class="btn primary" data-bulk="start">▶ 启动</button><button class="btn" data-bulk="stop">■ 停止</button><button class="btn" data-bulk="restart">↻ 重启</button><span class="sep"></span><button class="btn" data-bulk="update">⇩ 更新 JAR</button><span class="spacer"></span><input id="search" class="search" placeholder="搜索应用名称 / PID / 端口"></section><section class="panel"><div class="panelhead"><strong>服务列表</strong><span class="muted" id="count">13 个应用</span></div><div class="tablewrap"><table><thead><tr><th><input type="checkbox" class="check" id="all" aria-label="全选"></th><th>应用名称</th><th>PID</th><th>启动时间</th><th>JVM 内存 (最小 / 实际 / 最大)</th><th>JAR 更新时间</th><th>监听端口</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="bottom"><div class="panel"><div class="panelhead"><strong>操作记录</strong><button class="action" id="clear">清空</button></div><div class="logs" id="logs"></div></div><div class="panel"><div class="panelhead"><strong>运行配置</strong><span class="muted">conf · 只读</span></div><div class="config"><span class="muted">管理目录</span><span class="value" title="C:\Users\corwin\Desktop\cis-cluster">C:\Users\corwin\Desktop\cis-cluster</span><span class="muted">Java 路径</span><span class="value" title="D:\DevApp\java\jdk8u392-full\bin">D:\DevApp\java\jdk8u392-full\bin</span><span class="muted">默认堆内存</span><span class="value">64m – 128m</span><span class="muted">停止超时</span><span class="value">15s / 5s</span><span class="muted">状态刷新</span><span class="value">3s</span><span class="muted">日志目录</span><span class="value">logs</span></div></div></section></main><footer class="footer"><span>配置文件：./conf</span><span>本地 · Windows 11 <span style="margin-left:12px">CIS Cluster</span></span></footer></div><div class="toast" id="toast"></div><script>
// Browser-only interaction mock. Real process and file operations belong to the Rust backend.
const names=['agent','crm','masset','message','pay','prepay','postpay','sts','system','tariff','workorder','gateway','usercenter'];
const ports={agent:[8090],crm:[8082],masset:[8084],message:[8085],pay:[8086],prepay:[8087],postpay:[8088],sts:[8091],system:[8081],tariff:[8092],workorder:[8093],gateway:[8080,18080],usercenter:[8083]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d).toLocaleString('sv-SE',{hour12:false}).replace('T',' '):'—';
const services=names.map((name,i)=>({name,running:[0,1,3,4,7,8,11,12].includes(i),pid:0,started:null,ports:ports[name],phase:'',rss:0,jarUpdated:new Date(Date.now()-(i+1)*86400000*2)}));
services.forEach((s,i)=>{if(s.running){s.pid=11840+i*372;s.started=new Date(Date.now()-(i+2)*743000);s.rss=94+i*11;}});
const chosen=new Set();let globalBusy=false;let refreshBusy=false;
function log(message,type=''){const line=document.createElement('div');const time=document.createElement('span');time.className='logtime';time.textContent=new Date().toLocaleTimeString('en-GB',{hour12:false});const msg=document.createElement('span');msg.className=type==='ok'?'logok':type==='err'?'logerr':'';msg.textContent=message;line.append(time,msg);$('logs').prepend(line);while($('logs').children.length>100)$('logs').lastChild.remove()}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function matches(s,q){return s.name.includes(q)||(s.pid&&String(s.pid).includes(q))||(s.running&&s.ports.some(p=>String(p).includes(q)))}
function can(s,action){if(globalBusy)return false;if(action==='start')return !s.running;if(action==='stop')return s.running;if(action==='restart')return s.running;if(action==='update')return true;return false}
function render(){const q=$('search').value.trim().toLowerCase();const filtered=services.filter(s=>matches(s,q));$('rows').innerHTML=filtered.map(s=>`<tr class="data ${chosen.has(s.name)?'selected':''}"><td><input class="check rowcheck" type="checkbox" data-name="${s.name}" ${chosen.has(s.name)?'checked':''} ${globalBusy?'disabled':''}></td><td><span class="name ${s.phase?'name-busy':s.running?'name-running':'name-stopped'}">${s.name}</span></td><td class="mono">${s.running?s.pid:'—'}</td><td class="mono">${s.running?fmt(s.started):'—'}</td><td class="mono">${s.running?`64m / <span class="actual">${s.rss} MB</span> / 128m`:'—'}</td><td class="mono">${fmt(s.jarUpdated)}</td><td>${s.running?s.ports.map(p=>`<span class="pill">TCP:${p}</span>`).join(''):'<span class="muted">—</span>'}</td><td><div class="row-actions">${[['start','启动'],['stop','停止'],['restart','重启'],['update','更新']].map(([a,label])=>`<button class="mini" data-action="${a}" data-name="${s.name}" ${can(s,a)?'':'disabled'}>${label}</button>`).join('')}</div></td></tr>`).join('')||'<tr><td colspan="8" class="empty">没有匹配的应用</td></tr>';
$('count').textContent=`${filtered.length} 个应用 · 已选 ${chosen.size}`;
$('all').checked=filtered.length>0&&filtered.every(s=>chosen.has(s.name));$('all').indeterminate=filtered.some(s=>chosen.has(s.name))&&!$('all').checked;$('all').disabled=globalBusy;
for(const b of document.querySelectorAll('[data-bulk]')){const a=b.dataset.bulk;b.disabled=globalBusy||![...chosen].some(n=>{const s=services.find(x=>x.name===n);return s&&can(s,a)})}
$('reload').disabled=globalBusy||refreshBusy;$('clear').disabled=globalBusy;
$('activity').textContent=globalBusy?'任务执行中':'监控中';$('indicator').classList.toggle('working',globalBusy);
}
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function perform(action,targets){if(globalBusy)return;const candidates=targets.map(n=>services.find(s=>s.name===n)).filter(s=>s&&can(s,action));if(!candidates.length)return;globalBusy=true;render();const labels={start:'启动',stop:'停止',restart:'重启',update:'更新 JAR'};log(`开始${labels[action]} · ${candidates.length} 个应用`);
try{for(const s of candidates){s.phase=action==='stop'||action==='restart'?'stopping':'working';render();log(`${s.name} · ${labels[action]}中`);await sleep(700);if(action==='stop'){s.running=false;s.pid=0;s.started=null;s.rss=0}else if(action==='start'||action==='restart'){s.running=true;s.pid=12000+Math.floor(Math.random()*40000);s.started=new Date();s.rss=85+Math.floor(Math.random()*65)}else if(action==='update'){s.jarUpdated=new Date()}s.phase='';log(`${s.name} · ${ {start:'启动成功',stop:'已停止',restart:'重启成功',update:'JAR 更新完成'}[action]}`,'ok');render()}}
finally{globalBusy=false;render();toast(`${labels[action]}完成`)}}
document.addEventListener('change',e=>{if(globalBusy)return;if(e.target.matches('.rowcheck')){e.target.checked?chosen.add(e.target.dataset.name):chosen.delete(e.target.dataset.name);render()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled)perform(b.dataset.action,[b.dataset.name]);const bulk=e.target.closest('[data-bulk]');if(bulk&&!bulk.disabled)perform(bulk.dataset.bulk,[...chosen])});
$('all').addEventListener('change',e=>{if(globalBusy)return;const q=$('search').value.trim().toLowerCase();services.filter(s=>matches(s,q)).forEach(s=>e.target.checked?chosen.add(s.name):chosen.delete(s.name));render()});
$('search').addEventListener('input',render);
$('reload').onclick=async()=>{if(globalBusy||refreshBusy)return;refreshBusy=true;render();await sleep(250);refreshBusy=false;log('状态已刷新','ok');render()};
$('clear').onclick=()=>{if(!globalBusy)$('logs').replaceChildren()};
function clock(){$('clock').textContent=new Date().toLocaleString('sv-SE',{hour12:false})}clock();setInterval(clock,1000);setInterval(()=>{if(!globalBusy&&!refreshBusy)render()},3000);log('配置加载完成 · 13 个应用','ok');log('服务状态扫描完成','ok');render();
</script></body></html>
