# jkeeper 配置
# conf 与程序 exe 放在同一目录。所有应用由 [[apps]] 明确列出。
# Windows 路径使用单引号；java_path 与 source_files 必须是绝对路径。

[general]
manage_dir = 'C:\Users\corwin\Desktop\cis-cluster'

# 必须直接指向 java.exe。
java_path = 'D:\DevApp\java\jdk8u392-full\bin\java.exe'

# JVM 参数为单行；系统属性与 Spring 参数为参数行数组。
java_vm_args = '-Xms64m -Xmx128m'
java_system_args = ['-Dfile.encoding=utf-8']
java_agent_args = ''
java_spring_args = [
    '--spring.config.location=file:./application.yml,file:./bootstrap.yaml',
]

pid_file = '{app}.pid'
stop_timeout_seconds = 15
force_kill_timeout_seconds = 5
start_check_seconds = 2
log_dir = 'logs'

[[apps]]
name = 'gateway'
type = 'java'
source_files = [
    'D:\Gitlab\cis\witlink-platform-usercenter\witlink-platform-gateway\target\gateway.jar',
]

